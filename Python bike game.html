<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bike Game — pygame window &amp; VS Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 25%, #0b2447 0%, #051329 55%, #020814 100%);
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    .display-font {
      font-family: 'Fredoka', 'Inter', sans-serif;
      letter-spacing: 0.03em;
    }

    .mono-font {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }

    /* Glowing window border matching the video's neon sky-blue frame */
    .studio-window {
      border: 2px solid #2b7de9;
      box-shadow: 0 0 24px rgba(43, 125, 233, 0.28), 0 14px 35px rgba(0, 0, 0, 0.65);
    }

    /* VS Code Syntax Colors */
    .py-kw { color: #c586c0; }
    .py-bi { color: #4ec9b0; }
    .py-fn { color: #dcdcaa; }
    .py-str { color: #ce9178; }
    .py-num { color: #b5cea8; }
    .py-var { color: #9cdcfe; }
    .py-op { color: #d4d4d4; }

    .vscode-line-active {
      background-color: rgba(255, 255, 255, 0.06);
      box-shadow: inset 2px 0 0 #007acc;
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background-color: #aeafad;
      vertical-align: text-bottom;
      animation: blinkCursor 0.9s steps(2, start) infinite;
    }

    @keyframes blinkCursor {
      to { visibility: hidden; }
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }
    ::-webkit-scrollbar-thumb {
      background: #3c3c3c;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center py-3 px-3 sm:py-5 sm:px-6">

  <!-- Main Studio Container (Exact 2-window vertical layout from video) -->
  <div class="w-full max-w-[490px] flex flex-col gap-3 sm:gap-3.5 my-auto">

    <!-- =====================================================================
         1. TOP WINDOW: Bike Game — pygame window
    ====================================================================== -->
    <div id="pygame-window" class="studio-window rounded-xl overflow-hidden bg-[#0a0e17] flex flex-col">
      <!-- Desktop Window Title Bar -->
      <div class="h-8 sm:h-9 bg-[#f3f4f6] text-slate-800 px-3 flex items-center justify-between border-b border-slate-300 shrink-0">
        <div class="flex items-center gap-2">
          <!-- Colorful Gamepad Icon -->
          <span class="inline-flex items-center justify-center w-5 h-5 rounded bg-indigo-600 text-white text-[11px] shadow-sm">
            🎮
          </span>
          <span class="text-xs sm:text-[13px] font-semibold tracking-tight text-slate-800">
            Bike Game — pygame window
          </span>
        </div>

        <!-- Window Controls + Audio Toggle -->
        <div class="flex items-center gap-1.5">
          <button id="btn-sound" title="Toggle Engine Sound"
            class="px-2 py-0.5 rounded bg-slate-200 hover:bg-slate-300 text-slate-700 text-[11px] font-semibold transition mr-1">
            🔊 SFX
          </button>
          <span class="w-6 h-5 flex items-center justify-center text-slate-500 text-xs font-bold rounded hover:bg-slate-200 cursor-default">—</span>
          <span class="w-6 h-5 flex items-center justify-center text-slate-500 text-xs rounded hover:bg-slate-200 cursor-default">□</span>
          <button id="btn-reset-win" title="Restart Game"
            class="w-6 h-5 flex items-center justify-center bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold rounded transition">
            ✕
          </button>
        </div>
      </div>

      <!-- Game Viewport Canvas Wrapper -->
      <div id="canvas-container" class="relative w-full aspect-[4/3.45] sm:aspect-[4/3.35] bg-[#080c14] overflow-hidden">
        <canvas id="gameCanvas" class="w-full h-full block"></canvas>

        <!-- "Waiting for Run ..." Overlay (Shown when replaying the video's typing intro) -->
        <div id="waiting-overlay" class="hidden absolute inset-0 bg-[#070b14] flex flex-col items-center justify-center z-20">
          <p class="mono-font text-slate-400 text-base sm:text-lg tracking-widest animate-pulse">
            Waiting for Run . . .
          </p>
          <button id="btn-skip-intro" class="mt-4 px-3.5 py-1.5 rounded-lg bg-sky-500/20 hover:bg-sky-500/30 border border-sky-400/40 text-sky-300 text-xs font-medium transition">
            Skip &amp; Play Now ▶
          </button>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameover-overlay" class="hidden absolute inset-0 bg-black/65 backdrop-blur-[2px] flex flex-col items-center justify-center p-4 text-center z-30">
          <div class="bg-[#0d1526]/95 border-2 border-sky-400/70 rounded-2xl px-6 py-5 shadow-2xl max-w-[280px] w-full">
            <div class="text-rose-400 font-extrabold text-xs uppercase tracking-widest mb-1">Collision!</div>
            <h2 class="display-font text-2xl sm:text-3xl font-bold text-white mb-3">GAME OVER</h2>
            <div class="flex justify-around bg-slate-900/90 rounded-xl py-2.5 px-3 mb-4 border border-slate-800">
              <div>
                <div class="text-[10px] text-sky-400 font-bold uppercase">Score</div>
                <div id="final-score" class="display-font text-xl font-bold text-white">0</div>
              </div>
              <div class="w-px bg-slate-800"></div>
              <div>
                <div class="text-[10px] text-amber-400 font-bold uppercase">Best</div>
                <div id="best-score" class="display-font text-xl font-bold text-white">0</div>
              </div>
            </div>
            <button id="btn-play-again"
              class="w-full py-2.5 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-orange-500/25 transition active:scale-95">
              PLAY AGAIN (SPACE)
            </button>
          </div>
        </div>

        <!-- Subtle Touch / On-Screen Steering Controls (Mobile & Mouse friendly) -->
        <div id="touch-controls" class="absolute bottom-2.5 inset-x-3 flex items-center justify-between pointer-events-none z-10 opacity-85 hover:opacity-100 transition">
          <button id="btn-left" aria-label="Steer Left"
            class="pointer-events-auto w-12 h-11 sm:w-12 sm:h-10 rounded-xl bg-black/45 active:bg-sky-500/60 border border-white/20 backdrop-blur-sm flex items-center justify-center text-white text-lg font-bold shadow-md">
            ◀
          </button>
          <span class="text-[10px] sm:text-[11px] font-semibold tracking-wider uppercase text-white/75 bg-black/35 px-2.5 py-1 rounded-full backdrop-blur-sm">
            ← / → or Drag to Steer
          </span>
          <button id="btn-right" aria-label="Steer Right"
            class="pointer-events-auto w-12 h-11 sm:w-12 sm:h-10 rounded-xl bg-black/45 active:bg-sky-500/60 border border-white/20 backdrop-blur-sm flex items-center justify-center text-white text-lg font-bold shadow-md">
            ▶
          </button>
        </div>
      </div>
    </div>

    <!-- =====================================================================
         2. MIDDLE BANNER (Exact typography from video)
    ====================================================================== -->
    <div class="text-center py-0.5 select-none">
      <h1 id="banner-text" class="display-font text-xl sm:text-[26px] font-bold tracking-wide text-white drop-shadow-[0_2px_10px_rgba(0,0,0,0.8)]">
        22 LINES. THAT'S IT.
      </h1>
    </div>

    <!-- =====================================================================
         3. BOTTOM WINDOW: bike.py — bike-game — Visual Studio Code
    ====================================================================== -->
    <div class="studio-window rounded-xl overflow-hidden bg-[#1e1e1e] flex flex-col">
      <!-- VS Code Title Bar -->
      <div class="h-8 bg-[#252526] px-3 flex items-center justify-between border-b border-[#141414]">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-[#ff5f56] inline-block"></span>
          <span class="w-3 h-3 rounded-full bg-[#ffbd2e] inline-block"></span>
          <span class="w-3 h-3 rounded-full bg-[#27c93f] inline-block"></span>
        </div>
        <div class="text-[11px] sm:text-xs text-[#cccccc] font-medium truncate px-2">
          bike.py — bike-game — Visual Studio Code
        </div>
        <div class="w-10"></div>
      </div>

      <!-- VS Code Tab Bar & Action Buttons -->
      <div class="h-8 bg-[#252526] flex items-center justify-between border-b border-[#181818] pr-2">
        <!-- Active File Tab -->
        <div class="h-full bg-[#1e1e1e] px-3 flex items-center gap-2 border-t-2 border-[#007acc] text-xs text-white">
          <span class="text-[#3776ab] font-bold text-[11px]">🐍</span>
          <span class="mono-font text-[12px]">bike.py</span>
          <span class="text-neutral-500 text-[11px] ml-1">×</span>
        </div>

        <!-- Run / Replay Typing Animation & Copy Code Controls -->
        <div class="flex items-center gap-1.5">
          <button id="btn-replay-typing" title="Watch the 22 lines type out & launch!"
            class="px-2 py-0.5 rounded bg-[#2d2d30] hover:bg-[#3e3e42] text-[11px] text-sky-300 font-medium transition flex items-center gap-1">
            <span>⌨ Replay Typing</span>
          </button>
          <button id="btn-copy-code" title="Copy Python Code"
            class="px-2 py-0.5 rounded bg-[#2d2d30] hover:bg-[#3e3e42] text-[11px] text-neutral-300 font-medium transition">
            Copy
          </button>
          <button id="btn-run-code" title="Run bike.py"
            class="w-6 h-6 rounded hover:bg-[#383838] flex items-center justify-center text-[#4ec9b0] text-xs font-bold transition">
            ▶
          </button>
        </div>
      </div>

      <!-- Code Editor Body (Exact 22 lines from video) -->
      <div id="vscode-editor" class="mono-font bg-[#1e1e1e] py-2.5 px-2 sm:px-3 text-[11px] sm:text-[12.5px] leading-[1.48] overflow-x-auto max-h-[295px] sm:max-h-[340px] overflow-y-auto">
        <!-- Populated dynamically by JS so both live highlight and typing replay work seamlessly -->
      </div>

      <!-- VS Code Status Bar -->
      <div class="h-5 bg-[#007acc] text-white px-2.5 flex items-center justify-between text-[10px] sm:text-[11px] font-medium">
        <div class="flex items-center gap-3">
          <span class="flex items-center gap-1">
            <span>⎇</span>
            <span>main</span>
          </span>
          <span>⊗ 0 &nbsp;⚠ 0</span>
        </div>
        <div class="flex items-center gap-2.5 sm:gap-3">
          <span id="status-cursor">Ln 22, Col 18</span>
          <span class="hidden sm:inline">Spaces: 4</span>
          <span>UTF-8</span>
          <span>Python 3.13</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      'use strict';

      // =========================================================================
      // 1. EXACT 22-LINE PYTHON CODE FROM VIDEO
      // =========================================================================
      const PYTHON_LINES = [
        'import pygame',
        'from random import randint',
        '',
        'pygame.init()',
        'screen = pygame.display.set_mode((400, 600))',
        'clock = pygame.time.Clock()',
        '',
        'x = 100',
        'rocks = [[randint(0, 360), 150 * i] for i in range(4)]',
        'while True:',
        '    for e in pygame.event.get():',
        '        if e.type == pygame.QUIT:',
        '            raise SystemExit',
        '    keys = pygame.key.get_pressed()',
        '    x += (keys[pygame.K_RIGHT] - keys[pygame.K_LEFT]) * 8',
        '    screen.fill((30, 30, 30))',
        '    pygame.draw.rect(screen, "orange", (x, 500, 40, 80))',
        '    for rock in rocks:',
        '        rock[1] = (rock[1] + 6) % 600',
        '        pygame.draw.rect(screen, "gray", (*rock, 40, 40))',
        '    pygame.display.flip()',
        '    clock.tick(60)'
      ];

      function highlightPythonLine(raw) {
        if (!raw) return '&nbsp;';
        // Escape HTML first
        let s = raw
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        // Strings
        s = s.replace(/("[^"]*")/g, '<span class="py-str">$1</span>');
        // Numbers
        s = s.replace(/\b(\d+)\b/g, '<span class="py-num">$1</span>');
        // Keywords
        s = s.replace(/\b(import|from|for|in|while|if|raise|True)\b/g, '<span class="py-kw">$1</span>');
        // Builtins / Modules
        s = s.replace(/\b(pygame|randint|range|SystemExit)\b/g, '<span class="py-bi">$1</span>');
        // Methods / Attributes
        s = s.replace(/\.(init|display|set_mode|time|Clock|event|get|type|QUIT|key|get_pressed|K_RIGHT|K_LEFT|fill|draw|rect|flip|tick)\b/g,
          '.<span class="py-fn">$1</span>');
        return s;
      }

      const editorEl = document.getElementById('vscode-editor');
      const statusCursorEl = document.getElementById('status-cursor');
      const bannerTextEl = document.getElementById('banner-text');

      function renderVSCodeLines(linesToRender, activeLineIdx = -1, showCursor = false) {
        editorEl.innerHTML = linesToRender.map((line, idx) => {
          const lineNum = idx + 1;
          const isActive = idx === activeLineIdx;
          const cursorHtml = isActive && showCursor ? '<span class="typing-cursor"></span>' : '';
          return `
            <div class="flex items-center px-1.5 rounded-sm ${isActive ? 'vscode-line-active' : ''}">
              <span class="w-7 text-right pr-3 text-[#858585] select-none shrink-0">${lineNum}</span>
              <span class="whitespace-pre text-[#d4d4d4]">${highlightPythonLine(line)}${cursorHtml}</span>
            </div>
          `;
        }).join('');
      }

      // Initialize with all 22 lines visible
      renderVSCodeLines(PYTHON_LINES, 21, false);

      // Copy button handler
      document.getElementById('btn-copy-code').addEventListener('click', () => {
        const ta = document.createElement('textarea');
        ta.value = PYTHON_LINES.join('\n');
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        const btn = document.getElementById('btn-copy-code');
        btn.textContent = 'Copied!';
        btn.classList.add('text-emerald-400');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('text-emerald-400');
        }, 1500);
      });

      // =========================================================================
      // 2. WEB AUDIO SYNTHESIZER (Subtle Retro Engine & Crash SFX)
      // =========================================================================
      let audioCtx = null;
      let soundEnabled = true;

      function ensureAudio() {
        if (!soundEnabled) return null;
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playKeyTick() {
        const ctx = ensureAudio();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520 + Math.random() * 140, ctx.currentTime);
        gain.gain.setValueAtTime(0.025, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.035);
      }

      function playPassChime() {
        const ctx = ensureAudio();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.11);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      }

      function playCrashSound() {
        const ctx = ensureAudio();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(36, ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.38);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      }

      document.getElementById('btn-sound').addEventListener('click', (e) => {
        soundEnabled = !soundEnabled;
        e.target.textContent = soundEnabled ? '🔊 SFX' : '🔇 MUTE';
        if (soundEnabled) ensureAudio();
      });

      // =========================================================================
      // 3. 2.5D SUNSET DESERT BIKE GAME ENGINE
      // =========================================================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const waitingOverlay = document.getElementById('waiting-overlay');
      const gameoverOverlay = document.getElementById('gameover-overlay');
      const finalScoreEl = document.getElementById('final-score');
      const bestScoreEl = document.getElementById('best-score');

      let W = 480;
      let H = 400;

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = rect.width;
        H = rect.height;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resizeCanvas);

      // Game State
      let state = 'PLAYING'; // 'TYPING' | 'PLAYING' | 'GAMEOVER'
      let score = 0;
      let bestScore = 0;
      let speed = 78;
      let roadScroll = 0;
      let shakeTimer = 0;
      let frameTick = 0;

      // Normalized bike horizontal position on road: -1.0 (left edge) to +1.0 (right edge)
      let bikeLaneX = -0.22;
      let bikeTilt = 0;

      // Input state
      const keys = { left: false, right: false };
      let pointerActive = false;
      let pointerLastX = 0;

      // 4 Boulders matching `rocks = [[randint(0, 360), 150 * i] for i in range(4)]`
      // z goes from 0.0 (horizon) to 1.0 (bottom of screen)
      let rocks = [];
      let roadsideProps = [];
      let particles = [];

      function initGameEntities() {
        score = 0;
        speed = 78;
        bikeLaneX = -0.18;
        bikeTilt = 0;
        shakeTimer = 0;
        particles = [];

        // Spawn 4 staggered rocks along the perspective highway
        rocks = [0, 1, 2, 3].map((i) => ({
          laneX: (Math.random() * 1.46) - 0.73,
          z: 0.08 + i * 0.22,
          scored: false,
          seed: Math.random() * 10
        }));

        // Roadside cacti & desert stones for rich depth perception
        roadsideProps = [];
        for (let i = 0; i < 14; i++) {
          roadsideProps.push({
            side: i % 2 === 0 ? -1 : 1,
            offset: 1.25 + Math.random() * 1.4,
            z: i / 14,
            type: i % 3 === 0 ? 'rock' : 'cactus',
            scale: 0.8 + Math.random() * 0.45
          });
        }
      }

      // Keyboard Controls
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          keys.left = true;
          ensureAudio();
        }
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          keys.right = true;
          ensureAudio();
        }
        if (e.code === 'Space' && state === 'GAMEOVER') {
          e.preventDefault();
          startGame();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      });

      // Touch / Button Controls
      const btnLeft = document.getElementById('btn-left');
      const btnRight = document.getElementById('btn-right');

      const bindHold = (el, dir) => {
        el.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          keys[dir] = true;
          ensureAudio();
        });
        const release = () => { keys[dir] = false; };
        el.addEventListener('pointerup', release);
        el.addEventListener('pointerleave', release);
        el.addEventListener('pointercancel', release);
      };
      bindHold(btnLeft, 'left');
      bindHold(btnRight, 'right');

      // Direct Canvas Touch/Mouse Drag Steering
      canvas.addEventListener('pointerdown', (e) => {
        if (state !== 'PLAYING') return;
        pointerActive = true;
        pointerLastX = e.clientX;
        ensureAudio();
      });
      window.addEventListener('pointermove', (e) => {
        if (!pointerActive || state !== 'PLAYING') return;
        const dx = e.clientX - pointerLastX;
        pointerLastX = e.clientX;
        bikeLaneX += (dx / (W * 0.34));
        bikeLaneX = Math.max(-0.82, Math.min(0.82, bikeLaneX));
        bikeTilt = Math.max(-0.35, Math.min(0.35, dx * 0.025));
      });
      window.addEventListener('pointerup', () => {
        pointerActive = false;
      });

      // =========================================================================
      // 4. PERSPECTIVE PROJECTION & SCENE ARTWORK (Matching the video frame-for-frame)
      // =========================================================================
      function getHorizonY() {
        return H * 0.43;
      }

      // Maps depth t in [0..1] (0 = horizon, 1 = bottom edge) to screen Y & road half-width
      function projectRoad(t) {
        const horizonY = getHorizonY();
        // Slight perspective curve so distant motion feels authentic 2.5D
        const persp = Math.pow(t, 1.18);
        const y = horizonY + persp * (H - horizonY);
        const topHalfW = W * 0.048;
        const botHalfW = W * 0.44;
        const halfW = topHalfW + (botHalfW - topHalfW) * persp;
        return { y, halfW, persp };
      }

      function drawSunsetBackground() {
        const horizonY = getHorizonY();

        // 1. Sunset Sky Gradient (Deep twilight purple -> warm peach -> golden sun glow)
        const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
        skyGrad.addColorStop(0.0, '#1e2542');
        skyGrad.addColorStop(0.28, '#4a3f6b');
        skyGrad.addColorStop(0.58, '#b86b68');
        skyGrad.addColorStop(0.84, '#f29f58');
        skyGrad.addColorStop(1.0, '#ffd485');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, horizonY + 2);

        // 2. Glowing Setting Sun at Center Horizon
        const sunX = W * 0.5;
        const sunY = horizonY - H * 0.02;
        const sunR = Math.min(W, H) * 0.145;

        const sunHalo = ctx.createRadialGradient(sunX, sunY, sunR * 0.1, sunX, sunY, sunR * 2.4);
        sunHalo.addColorStop(0, 'rgba(255, 248, 214, 0.95)');
        sunHalo.addColorStop(0.35, 'rgba(255, 200, 110, 0.45)');
        sunHalo.addColorStop(1, 'rgba(255, 160, 80, 0)');
        ctx.fillStyle = sunHalo;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR * 2.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff5cc';
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR * 0.72, 0, Math.PI * 2);
        ctx.fill();

        // 3. Soft Sunset Clouds
        ctx.fillStyle = 'rgba(255, 224, 178, 0.22)';
        const drawCloud = (cx, cy, cw, ch) => {
          ctx.beginPath();
          ctx.ellipse(cx, cy, cw, ch, 0, 0, Math.PI * 2);
          ctx.fill();
        };
        drawCloud(W * 0.22, horizonY * 0.58, W * 0.14, H * 0.022);
        drawCloud(W * 0.78, horizonY * 0.52, W * 0.15, H * 0.024);
        drawCloud(W * 0.65, horizonY * 0.72, W * 0.11, H * 0.016);

        // 4. Distant Layered Desert Mountains & Mesas
        // Back ridge
        ctx.fillStyle = '#9e6258';
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.lineTo(0, horizonY - H * 0.08);
        ctx.lineTo(W * 0.16, horizonY - H * 0.125);
        ctx.lineTo(W * 0.31, horizonY - H * 0.055);
        ctx.lineTo(W * 0.43, horizonY - H * 0.045);
        ctx.lineTo(W * 0.57, horizonY - H * 0.045);
        ctx.lineTo(W * 0.70, horizonY - H * 0.095);
        ctx.lineTo(W * 0.85, horizonY - H * 0.13);
        ctx.lineTo(W, horizonY - H * 0.075);
        ctx.lineTo(W, horizonY);
        ctx.closePath();
        ctx.fill();

        // Foreground warm terracotta mesa silhouettes
        ctx.fillStyle = '#b9754d';
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.lineTo(0, horizonY - H * 0.045);
        ctx.lineTo(W * 0.12, horizonY - H * 0.065);
        ctx.lineTo(W * 0.22, horizonY - H * 0.065);
        ctx.lineTo(W * 0.34, horizonY - H * 0.015);
        ctx.lineTo(W * 0.66, horizonY - H * 0.015);
        ctx.lineTo(W * 0.78, horizonY - H * 0.07);
        ctx.lineTo(W * 0.90, horizonY - H * 0.07);
        ctx.lineTo(W, horizonY - H * 0.04);
        ctx.lineTo(W, horizonY);
        ctx.closePath();
        ctx.fill();

        // 5. Golden-Ochre Desert Ground
        const groundGrad = ctx.createLinearGradient(0, horizonY, 0, H);
        groundGrad.addColorStop(0, '#e3a857');
        groundGrad.addColorStop(0.45, '#d69342');
        groundGrad.addColorStop(1, '#c47c2c');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, horizonY, W, H - horizonY);
      }

      function drawRoad() {
        const top = projectRoad(0);
        const bot = projectRoad(1);
        const cx = W * 0.5;

        // Outer golden-yellow curb border
        ctx.fillStyle = '#f5b841';
        ctx.beginPath();
        ctx.moveTo(cx - top.halfW * 1.12, top.y);
        ctx.lineTo(cx + top.halfW * 1.12, top.y);
        ctx.lineTo(cx + bot.halfW * 1.08, bot.y);
        ctx.lineTo(cx - bot.halfW * 1.08, bot.y);
        ctx.closePath();
        ctx.fill();

        // Main Asphalt Surface
        const roadGrad = ctx.createLinearGradient(0, top.y, 0, bot.y);
        roadGrad.addColorStop(0, '#4f5561');
        roadGrad.addColorStop(0.4, '#3c414b');
        roadGrad.addColorStop(1, '#2b2f36');
        ctx.fillStyle = roadGrad;
        ctx.beginPath();
        ctx.moveTo(cx - top.halfW, top.y);
        ctx.lineTo(cx + top.halfW, top.y);
        ctx.lineTo(cx + bot.halfW, bot.y);
        ctx.lineTo(cx - bot.halfW, bot.y);
        ctx.closePath();
        ctx.fill();

        // Crisp White Edge Lines
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        // Left edge
        ctx.beginPath();
        ctx.moveTo(cx - top.halfW * 0.96, top.y);
        ctx.lineTo(cx - top.halfW * 0.90, top.y);
        ctx.lineTo(cx - bot.halfW * 0.93, bot.y);
        ctx.lineTo(cx - bot.halfW * 0.98, bot.y);
        ctx.closePath();
        ctx.fill();

        // Right edge
        ctx.beginPath();
        ctx.moveTo(cx + top.halfW * 0.90, top.y);
        ctx.lineTo(cx + top.halfW * 0.96, top.y);
        ctx.lineTo(cx + bot.halfW * 0.98, bot.y);
        ctx.lineTo(cx + bot.halfW * 0.93, bot.y);
        ctx.closePath();
        ctx.fill();

        // Animated Center Dashed Lane Markings
        const numDashes = 9;
        for (let i = 0; i < numDashes; i++) {
          const t0 = ((i + roadScroll) % numDashes) / numDashes;
          const t1 = Math.min(1, t0 + 0.058);
          if (t1 <= t0) continue;

          const p0 = projectRoad(t0);
          const p1 = projectRoad(t1);
          const w0 = Math.max(1.2, p0.halfW * 0.032);
          const w1 = Math.max(2.0, p1.halfW * 0.036);

          ctx.fillStyle = `rgba(255, 255, 255, ${0.45 + p0.persp * 0.52})`;
          ctx.beginPath();
          ctx.moveTo(cx - w0, p0.y);
          ctx.lineTo(cx + w0, p0.y);
          ctx.lineTo(cx + w1, p1.y);
          ctx.lineTo(cx - w1, p1.y);
          ctx.closePath();
          ctx.fill();
        }
      }

      function drawRoadsideProp(prop) {
        const p = projectRoad(prop.z);
        const scale = (0.16 + p.persp * 0.95) * prop.scale;
        const x = W * 0.5 + prop.side * (p.halfW * prop.offset);
        const y = p.y;

        if (prop.type === 'cactus') {
          const h = 46 * scale;
          const w = 9 * scale;
          // Shadow
          ctx.fillStyle = 'rgba(110, 62, 18, 0.32)';
          ctx.beginPath();
          ctx.ellipse(x + w * 0.8, y, w * 1.4, w * 0.45, 0, 0, Math.PI * 2);
          ctx.fill();

          // Main trunk
          ctx.fillStyle = '#3d6b35';
          ctx.beginPath();
          ctx.roundRect(x - w * 0.5, y - h, w, h, w * 0.5);
          ctx.fill();

          // Left arm
          ctx.beginPath();
          ctx.roundRect(x - w * 1.65, y - h * 0.68, w * 1.3, w * 0.65, w * 0.3);
          ctx.roundRect(x - w * 1.65, y - h * 0.86, w * 0.68, h * 0.24, w * 0.3);
          ctx.fill();

          // Right arm
          ctx.beginPath();
          ctx.roundRect(x + w * 0.35, y - h * 0.52, w * 1.3, w * 0.65, w * 0.3);
          ctx.roundRect(x + w * 0.98, y - h * 0.74, w * 0.68, h * 0.28, w * 0.3);
          ctx.fill();

          // Highlight strip
          ctx.fillStyle = '#558b47';
          ctx.fillRect(x - w * 0.18, y - h * 0.92, w * 0.25, h * 0.86);
        } else {
          // Desert pebble cluster
          const rw = 18 * scale;
          const rh = 11 * scale;
          ctx.fillStyle = '#8d6e53';
          ctx.beginPath();
          ctx.ellipse(x, y - rh * 0.4, rw, rh, 0, Math.PI, 0);
          ctx.fill();
          ctx.fillStyle = '#a88768';
          ctx.beginPath();
          ctx.ellipse(x - rw * 0.2, y - rh * 0.5, rw * 0.55, rh * 0.6, 0, Math.PI, 0);
          ctx.fill();
        }
      }

      // Draw 3D-shaded Gray Boulder (`pygame.draw.rect(screen, "gray", (*rock, 40, 40))`)
      function drawRock(rock) {
        const p = projectRoad(rock.z);
        const cx = W * 0.5 + rock.laneX * (p.halfW * 0.82);
        const cy = p.y;
        const size = (10 + p.persp * 34);

        // Ground contact shadow
        ctx.fillStyle = 'rgba(15, 18, 24, 0.48)';
        ctx.beginPath();
        ctx.ellipse(cx, cy + size * 0.08, size * 0.78, size * 0.26, 0, 0, Math.PI * 2);
        ctx.fill();

        // Faceted gray boulder polygon matching the video's shaded rocks
        ctx.save();
        ctx.translate(cx, cy - size * 0.38);

        // Main rock body
        ctx.fillStyle = '#6e737b';
        ctx.beginPath();
        ctx.moveTo(-size * 0.66, size * 0.34);
        ctx.lineTo(-size * 0.72, -size * 0.06);
        ctx.lineTo(-size * 0.38, -size * 0.48);
        ctx.lineTo(size * 0.18, -size * 0.52);
        ctx.lineTo(size * 0.64, -size * 0.16);
        ctx.lineTo(size * 0.68, size * 0.32);
        ctx.lineTo(size * 0.22, size * 0.44);
        ctx.lineTo(-size * 0.32, size * 0.44);
        ctx.closePath();
        ctx.fill();

        // Top sunlit facet
        ctx.fillStyle = '#9aa0a8';
        ctx.beginPath();
        ctx.moveTo(-size * 0.54, -size * 0.08);
        ctx.lineTo(-size * 0.35, -size * 0.44);
        ctx.lineTo(size * 0.16, -size * 0.48);
        ctx.lineTo(size * 0.44, -size * 0.16);
        ctx.lineTo(size * 0.04, -size * 0.02);
        ctx.closePath();
        ctx.fill();

        // Bottom-right shadow facet
        ctx.fillStyle = '#4c5057';
        ctx.beginPath();
        ctx.moveTo(size * 0.04, -size * 0.02);
        ctx.lineTo(size * 0.62, -size * 0.12);
        ctx.lineTo(size * 0.64, size * 0.30);
        ctx.lineTo(size * 0.20, size * 0.40);
        ctx.lineTo(-size * 0.26, size * 0.38);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      // Draw Detailed Rear/3-4 Perspective Motorcycle & Rider (Matching the video)
      function drawBiker() {
        const p = projectRoad(0.86);
        const bx = W * 0.5 + bikeLaneX * (p.halfW * 0.82);
        const by = p.y + 8;
        const sc = Math.min(W, H) / 375;
        const bounce = Math.sin(frameTick * 0.45) * 1.3;

        ctx.save();
        ctx.translate(bx, by + bounce);
        ctx.scale(sc, sc);
        ctx.rotate(bikeTilt);

        // 1. Ground Shadow under motorcycle
        ctx.fillStyle = 'rgba(10, 12, 18, 0.55)';
        ctx.beginPath();
        ctx.ellipse(0, 4, 24, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // 2. Wide Dark Rear Tire
        ctx.fillStyle = '#181a1f';
        ctx.beginPath();
        ctx.roundRect(-10, -28, 20, 32, 8);
        ctx.fill();

        // Tire tread highlight
        ctx.fillStyle = '#2c3038';
        ctx.fillRect(-3, -26, 6, 28);

        // 3. Dual Chrome Exhaust Pipes & Swingarm
        ctx.fillStyle = '#94a3b8';
        ctx.beginPath();
        ctx.roundRect(-17, -23, 6, 17, 3);
        ctx.roundRect(11, -23, 6, 17, 3);
        ctx.fill();
        // Exhaust tips
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(-14, -8, 2.2, 0, Math.PI * 2);
        ctx.arc(14, -8, 2.2, 0, Math.PI * 2);
        ctx.fill();

        // 4. Orange-Red Sport Bike Tail & Fairing (Matching `pygame.draw.rect(screen, "orange", ...)`)
        const bodyGrad = ctx.createLinearGradient(-20, -54, 20, -20);
        bodyGrad.addColorStop(0, '#ff7b29');
        bodyGrad.addColorStop(0.5, '#f95716');
        bodyGrad.addColorStop(1, '#c2360c');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.moveTo(-18, -24);
        ctx.lineTo(-22, -44);
        ctx.lineTo(-10, -54);
        ctx.lineTo(10, -54);
        ctx.lineTo(22, -44);
        ctx.lineTo(18, -24);
        ctx.closePath();
        ctx.fill();

        // Glowing Red Tail Light Strip
        ctx.fillStyle = '#ff2a2a';
        ctx.shadowColor = '#ff2a2a';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.roundRect(-9, -35, 18, 4.5, 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // 5. Rider Legs & Riding Boots
        ctx.fillStyle = '#1e2433';
        ctx.beginPath();
        ctx.roundRect(-19, -46, 8, 26, 4);
        ctx.roundRect(11, -46, 8, 26, 4);
        ctx.fill();

        // Boots
        ctx.fillStyle = '#0f131a';
        ctx.beginPath();
        ctx.roundRect(-20, -22, 8, 9, 3);
        ctx.roundRect(12, -22, 8, 9, 3);
        ctx.fill();

        // 6. Rider Jacket Torso & Arms reaching handlebars
        const jacketGrad = ctx.createLinearGradient(0, -76, 0, -44);
        jacketGrad.addColorStop(0, '#2a354d');
        jacketGrad.addColorStop(1, '#181f2e');
        ctx.fillStyle = jacketGrad;
        ctx.beginPath();
        ctx.moveTo(-16, -45);
        ctx.lineTo(-23, -63);
        ctx.lineTo(-13, -75);
        ctx.lineTo(13, -75);
        ctx.lineTo(23, -63);
        ctx.lineTo(16, -45);
        ctx.closePath();
        ctx.fill();

        // Orange shoulder/sleeve accent stripe
        ctx.strokeStyle = '#ff7b29';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(-14, -71);
        ctx.lineTo(-21, -59);
        ctx.moveTo(14, -71);
        ctx.lineTo(21, -59);
        ctx.stroke();

        // 7. Glossy White Full-Face Helmet (Iconic feature in video)
        const helmGrad = ctx.createRadialGradient(-4, -89, 2, 0, -85, 15);
        helmGrad.addColorStop(0, '#ffffff');
        helmGrad.addColorStop(0.7, '#e2e8f0');
        helmGrad.addColorStop(1, '#94a3b8');
        ctx.fillStyle = helmGrad;
        ctx.beginPath();
        ctx.arc(0, -85, 13.5, 0, Math.PI * 2);
        ctx.fill();

        // Helmet dark rear vent / visor trim
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(-9, -86, 18, 5, 2.5);
        ctx.fill();

        ctx.restore();
      }

      // Draw Top-Left `SCORE` and Top-Right `SPEED` HUD (Exact match to video)
      function drawHUD() {
        ctx.save();

        // Top-Left: SCORE
        ctx.textAlign = 'left';
        ctx.fillStyle = '#38bdf8';
        ctx.font = '800 12px Inter, sans-serif';
        ctx.fillText('SCORE', 16, 26);

        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
        ctx.shadowBlur = 6;
        ctx.font = '700 32px Fredoka, Inter, sans-serif';
        ctx.fillText(String(score), 16, 56);
        ctx.shadowBlur = 0;

        // Top-Right: SPEED
        ctx.textAlign = 'right';
        ctx.fillStyle = '#38bdf8';
        ctx.font = '800 12px Inter, sans-serif';
        ctx.fillText('SPEED', W - 16, 26);

        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
        ctx.shadowBlur = 6;
        ctx.font = '700 32px Fredoka, Inter, sans-serif';
        ctx.fillText(String(Math.floor(speed)), W - 16, 56);
        ctx.shadowBlur = 0;

        ctx.restore();
      }

      function spawnCrashParticles(x, y) {
        const colors = ['#ff7b29', '#fbbf24', '#94a3b8', '#ef4444', '#ffffff'];
        for (let i = 0; i < 28; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 1.5 + Math.random() * 5.5;
          particles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 2,
            life: 1.0,
            color: colors[i % colors.length],
            size: 3 + Math.random() * 4
          });
        }
      }

      function updateAndDrawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.vy += 0.18;
          pt.life -= 0.03;
          if (pt.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = pt.life;
          ctx.fillStyle = pt.color;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      // =========================================================================
      // 5. SIMULATION UPDATE & MAIN 60FPS LOOP
      // =========================================================================
      function updateGame(dt) {
        if (state !== 'PLAYING') return;

        frameTick++;

        // Accelerate smoothly up to 160 like in the video (78 -> 126 -> 159 -> 160)
        speed = Math.min(160, speed + dt * 11.5);
        const speedNorm = speed / 120;

        // Scroll road dashes
        roadScroll = (roadScroll + dt * 6.5 * speedNorm) % 9;

        // Steering physics (`x += (keys[pygame.K_RIGHT] - keys[pygame.K_LEFT]) * 8`)
        const moveDir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        if (moveDir !== 0) {
          bikeLaneX += moveDir * dt * 1.48;
          bikeLaneX = Math.max(-0.82, Math.min(0.82, bikeLaneX));
          bikeTilt += (moveDir * 0.24 - bikeTilt) * 0.22;
        } else if (!pointerActive) {
          bikeTilt *= 0.82;
        }

        // Move roadside cacti & props
        for (let i = 0; i < roadsideProps.length; i++) {
          const pr = roadsideProps[i];
          pr.z += dt * 0.72 * speedNorm;
          if (pr.z > 1.05) {
            pr.z = 0.0;
            pr.offset = 1.25 + Math.random() * 1.3;
          }
        }

        // Move rocks (`rock[1] = (rock[1] + 6) % 600`)
        for (let i = 0; i < rocks.length; i++) {
          const r = rocks[i];
          r.z += dt * 0.62 * speedNorm;

          // Score increments when passing a boulder cleanly
          if (!r.scored && r.z > 0.90) {
            r.scored = true;
            score += 1;
            playPassChime();
          }

          // Respawn at horizon
          if (r.z > 1.04) {
            r.z = 0.02;
            r.laneX = (Math.random() * 1.48) - 0.74;
            r.scored = false;
          }

          // Collision Check near rider depth (z ~ 0.82 to 0.90)
          if (r.z > 0.81 && r.z < 0.895) {
            if (Math.abs(r.laneX - bikeLaneX) < 0.23) {
              triggerGameOver();
              return;
            }
          }
        }

        // Subtle live line highlight in VS Code matching active loop
        if (frameTick % 14 === 0) {
          const cycleLines = [14, 16, 18, 19, 20];
          const activeIdx = cycleLines[Math.floor(frameTick / 14) % cycleLines.length];
          renderVSCodeLines(PYTHON_LINES, activeIdx, false);
        }
      }

      function triggerGameOver() {
        state = 'GAMEOVER';
        shakeTimer = 14;
        playCrashSound();
        if (score > bestScore) bestScore = score;

        const p = projectRoad(0.86);
        const bx = W * 0.5 + bikeLaneX * (p.halfW * 0.82);
        spawnCrashParticles(bx, p.y - 25);

        finalScoreEl.textContent = String(score);
        bestScoreEl.textContent = String(bestScore);
        bannerTextEl.textContent = '22 LINES. THAT\'S IT.';
        gameoverOverlay.classList.remove('hidden');
      }

      function startGame() {
        if (typingTimer) {
          clearTimeout(typingTimer);
          typingTimer = null;
        }
        waitingOverlay.classList.add('hidden');
        gameoverOverlay.classList.add('hidden');
        bannerTextEl.textContent = '22 LINES. THAT\'S IT.';
        renderVSCodeLines(PYTHON_LINES, 21, false);
        statusCursorEl.textContent = 'Ln 22, Col 18';
        initGameEntities();
        state = 'PLAYING';
      }

      // =========================================================================
      // 6. OPTIONAL VIDEO INTRO REPLAY ("Waiting for Run ..." + Typing Sequence)
      // =========================================================================
      let typingTimer = null;

      function startTypingSequence() {
        if (typingTimer) clearTimeout(typingTimer);
        state = 'TYPING';
        gameoverOverlay.classList.add('hidden');
        waitingOverlay.classList.remove('hidden');
        bannerTextEl.textContent = 'PART 2: PYTHON BIKE GAME';

        let lineIdx = 0;
        let charIdx = 0;
        const typedLines = [''];

        function stepTyping() {
          if (state !== 'TYPING') return;

          if (lineIdx >= PYTHON_LINES.length) {
            // Finished all 22 lines -> launch game just like the video!
            setTimeout(() => {
              if (state === 'TYPING') startGame();
            }, 350);
            return;
          }

          const targetLine = PYTHON_LINES[lineIdx];
          if (charIdx < targetLine.length) {
            charIdx += 2; // Fast snappy typing cadence
            typedLines[lineIdx] = targetLine.slice(0, charIdx);
            if (charIdx % 4 === 0) playKeyTick();
          } else {
            lineIdx++;
            charIdx = 0;
            if (lineIdx < PYTHON_LINES.length) {
              typedLines.push('');
            }
          }

          const curLine = Math.min(lineIdx, PYTHON_LINES.length - 1);
          const curCol = (typedLines[curLine] || '').length + 1;
          statusCursorEl.textContent = `Ln ${curLine + 1}, Col ${curCol}`;
          renderVSCodeLines(typedLines, curLine, true);
          editorEl.scrollTop = editorEl.scrollHeight;

          typingTimer = setTimeout(stepTyping, 16);
        }

        stepTyping();
      }

      document.getElementById('btn-replay-typing').addEventListener('click', () => {
        ensureAudio();
        startTypingSequence();
      });
      document.getElementById('btn-skip-intro').addEventListener('click', () => {
        ensureAudio();
        startGame();
      });
      document.getElementById('btn-run-code').addEventListener('click', () => {
        ensureAudio();
        startGame();
      });
      document.getElementById('btn-play-again').addEventListener('click', () => {
        ensureAudio();
        startGame();
      });
      document.getElementById('btn-reset-win').addEventListener('click', () => {
        ensureAudio();
        startGame();
      });

      // =========================================================================
      // 7. RENDER FRAME & BOOT
      // =========================================================================
      function renderScene() {
        ctx.save();
        if (shakeTimer > 0) {
          shakeTimer--;
          const dx = (Math.random() - 0.5) * 9;
          const dy = (Math.random() - 0.5) * 9;
          ctx.translate(dx, dy);
        }

        drawSunsetBackground();
        drawRoad();

        // Sort roadside props and boulders back-to-front (painter's algorithm)
        const sortedProps = [...roadsideProps].sort((a, b) => a.z - b.z);
        for (let i = 0; i < sortedProps.length; i++) {
          drawRoadsideProp(sortedProps[i]);
        }

        const sortedRocks = [...rocks].sort((a, b) => a.z - b.z);
        for (let i = 0; i < sortedRocks.length; i++) {
          drawRock(sortedRocks[i]);
        }

        drawBiker();
        updateAndDrawParticles();
        drawHUD();

        ctx.restore();
      }

      let lastTime = performance.now();
      function gameLoop(now) {
        requestAnimationFrame(gameLoop);
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        updateGame(dt);
        renderScene();
      }

      window.onload = function () {
        resizeCanvas();
        startGame();
        requestAnimationFrame(gameLoop);
      };
    })();
  </script>
</body>
